<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Scottish Fitbaw League</title>
<meta property="og:title" content="Scottish Fitbaw League 2026/27">
<meta property="og:image" content="logo.png">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="header">
    <img class="header-logo" src="logo.png" alt="Scottish Fitbaw League">
    <div class="header-text">
      <h1>Scottish Fitbaw League</h1>
      <div class="season">Season 2026 / 27</div>
      <div class="tagline">Prediction League &bull; Est. 2021 &bull; 10 Players &bull; Scottish Football</div>
    </div>
    <div class="header-tools"><button class="icon-btn" id="theme-btn">&#9728; Light</button><div class="updated" id="updated"></div></div>
  </div>
  <div id="app"><div class="loading">Loading league&hellip;</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js"></script>
<script>
const app=document.getElementById('app');
Fitbaw.initTheme(document.getElementById('theme-btn'),app);
Fitbaw.loadState('data.json',function(state){
  Fitbaw.setUpdated(document.getElementById('updated'),state);
  Fitbaw.mount(app,state);
});
</script>
</body>
</html>
